const extendedLessonDetails = {"6": {"title": "Aktivitas dan ajakan", "patterns": [["N を Vます", "を menandai objek langsung.", "パンを たべます。", "Pan o tabemasu.", "Saya makan roti."], ["Vませんか／Vましょう", "Mengajak dengan halus atau mengusulkan kegiatan bersama.", "いっしょに えいがを みませんか。", "Issho ni eiga o mimasen ka.", "Maukah menonton film bersama?"]], "notes": ["を dibaca 'o' sebagai partikel objek.", "いっしょに berarti bersama."], "vocab": [["食べます", "たべます", "tabemasu", "makan"], ["飲みます", "のみます", "nomimasu", "minum"], ["見ます", "みます", "mimasu", "menonton"], ["聞きます", "ききます", "kikimasu", "mendengar"]]}, "7": {"title": "Alat, bahasa, dan memberi", "patterns": [["Alat で Vます", "で menunjukkan alat atau cara.", "はしで ごはんを たべます。", "Hashi de gohan o tabemasu.", "Saya makan nasi dengan sumpit."], ["人 に N を あげます", "に menandai penerima; あげます berarti memberi.", "ともだちに はなを あげます。", "Tomodachi ni hana o agemasu.", "Saya memberi bunga kepada teman."]], "notes": ["～語で berarti dalam bahasa ....", "もう berarti sudah; まだ berarti belum/masih."], "vocab": [["箸", "はし", "hashi", "sumpit"], ["花", "はな", "hana", "bunga"], ["あげます", "あげます", "agemasu", "memberi"], ["もらいます", "もらいます", "moraimasu", "menerima"]]}, "8": {"title": "Kata sifat", "patterns": [["い-adj です", "Kata sifat-i dapat langsung menjadi predikat.", "この ほんは おもしろいです。", "Kono hon wa omoshiroi desu.", "Buku ini menarik."], ["な-adj です／な + N", "Kata sifat-na memakai な sebelum kata benda.", "このまちは しずかです。", "Kono machi wa shizuka desu.", "Kota ini tenang."]], "notes": ["きれい dan ゆうめい termasuk na-adjective meskipun berakhir い.", "とても berarti sangat; あまり biasanya dipakai dengan bentuk negatif."], "vocab": [["面白い", "おもしろい", "omoshiroi", "menarik"], ["楽しい", "たのしい", "tanoshii", "menyenangkan"], ["静か", "しずか", "shizuka", "tenang"], ["有名", "ゆうめい", "yuumei", "terkenal"]]}, "9": {"title": "Kesukaan dan kemampuan", "patterns": [["N が 好き／嫌いです", "が menandai hal yang disukai/tidak disukai.", "おんがくが すきです。", "Ongaku ga suki desu.", "Saya suka musik."], ["N が わかります／できます", "が menandai hal yang dipahami atau dapat dilakukan.", "にほんごが すこし わかります。", "Nihongo ga sukoshi wakarimasu.", "Saya sedikit mengerti bahasa Jepang."]], "notes": ["よく = sering/dengan baik; あまり + negatif = tidak terlalu.", "から dapat menyatakan alasan."], "vocab": [["好き", "すき", "suki", "suka"], ["嫌い", "きらい", "kirai", "tidak suka"], ["音楽", "おんがく", "ongaku", "musik"], ["料理", "りょうり", "ryouri", "masakan"]]}, "10": {"title": "Keberadaan benda dan orang", "patterns": [["Tempat に N が あります", "あります digunakan untuk benda mati.", "つくえの うえに ほんが あります。", "Tsukue no ue ni hon ga arimasu.", "Ada buku di atas meja."], ["Tempat に N が います", "います digunakan untuk manusia dan hewan.", "こうえんに こどもが います。", "Kouen ni kodomo ga imasu.", "Ada anak-anak di taman."]], "notes": ["に menunjukkan lokasi keberadaan; で menunjukkan lokasi aktivitas.", "Posisi: 上 うえ, 下 した, 中 なか, 前 まえ, 後ろ うしろ."], "vocab": [["あります", "あります", "arimasu", "ada (benda)"], ["います", "います", "imasu", "ada (makhluk hidup)"], ["上", "うえ", "ue", "atas"], ["隣", "となり", "tonari", "sebelah"]]}, "11": {"title": "Jumlah dan hitungan", "patterns": [["Bilangan + counter", "Kata bantu bilangan dipilih sesuai jenis benda/orang.", "りんごを みっつ かいました。", "Ringo o mittsu kaimashita.", "Saya membeli tiga apel."], ["Durasi + Vます", "Durasi menyatakan lamanya kegiatan; umumnya tanpa に.", "まいにち ２じかん べんきょうします。", "Mainichi ni-jikan benkyou shimasu.", "Saya belajar dua jam setiap hari."]], "notes": ["～人 untuk orang; ～枚 untuk benda tipis; ～本 untuk benda panjang; ～冊 untuk buku.", "なんにん = berapa orang; なんまい = berapa lembar."], "vocab": [["一人", "ひとり", "hitori", "satu orang"], ["二人", "ふたり", "futari", "dua orang"], ["枚", "まい", "mai", "counter benda tipis"], ["冊", "さつ", "satsu", "counter buku"]]}, "12": {"title": "Perbandingan dan lampau", "patterns": [["A は B より Adj", "より menandai pembanding.", "でんしゃは バスより はやいです。", "Densha wa basu yori hayai desu.", "Kereta lebih cepat daripada bus."], ["～のなかで N が いちばん Adj", "Menyatakan yang paling dalam suatu kelompok.", "スポーツの なかで サッカーが いちばん ri-hari.", "～と言っていました dapat menyampaikan pesan orang lain."], "vocab": [["逃げます", "にげます", "nigemasu", "melarikan diri"], ["止まります", "とまります", "tomarimasu", "berhenti"], ["危ない", "あぶない", "abunai", "berbahaya"], ["連絡", "れんらく", "renraku", "kontak/kabar"]]}, "34": {"title": "Setelah dan sebelum", "patterns": [["Vたあとで", "Menyatakan setelah kegiatan selesai.", "ごはんを たべたあとで、くすりを のみます。", "Gohan o tabeta ato de, kusuri o nomimasu.", "Setelah makan, saya minum obat."], ["Vるまえに／N のまえに", "Menyatakan sebelum kegiatan atau waktu tertentu.", "ねるまえに はを みがきます。", "Neru mae ni ha o migakimasu.", "Sebelum tidur, saya menyikat gigi."]], "notes": ["Vたあとで = setelah melakukan; Vるまえに = sebelum melakukan.", "～とおりに berarti sesuai/seperti arahan."], "vocab": [["後", "あと", "ato", "setelah/belakang"], ["前", "まえ", "mae", "sebelum/depan"], ["磨きます", "みがきます", "migakimasu", "menyikat"], ["説明", "せつめい", "setsumei", "penjelasan"]]}, "35": {"title": "Kondisi ～ば dan ～なら", "patterns": [["Vば、～", "Menyatakan kondisi atau syarat.", "やすければ、かいます。", "Yasukereba, kaimasu.", "Kalau murah, saya beli."], ["N なら、～", "Menanggapi topik: kalau yang dimaksud ...", "にほんへ いくなら、はるが いいです。", "Nihon e iku nara, haru ga ii desu.", "Kalau pergi ke Jepang, musim semi bagus."]], "notes": ["い-adj: やすい→やすければ; na-adj/nomina: しずかなら／がくせいなら.", "～たら lebih fleksibel untuk kondisi konkret."], "vocab": [["春", "はる", "haru", "musim semi"], ["秋", "あき", "aki", "musim gugur"], ["条件", "じょうけん", "jouken", "syarat"], ["静か", "しずか", "shizuka", "tenang"]]}, "36": {"title": "Tujuan dan perubahan", "patterns": [["Vる／Vない + ように", "Menyatakan tujuan agar sesuatu terjadi/tidak terjadi.", "わすれないように メモします。", "Wasurenai you ni memo shimasu.", "Saya mencatat agar tidak lupa."], ["Vるようになります", "Menunjukkan perubahan kemampuan/kebiasaan.", "ひらがなが よめるようになりました。", "Hiragana ga yomeru you ni narimashita.", "Saya sekarang sudah bisa membaca hiragana."]], "notes": ["ように sering dipakai dengan kemampuan, keadaan, atau bentuk negatif.", "ようになる = menjadi bisa/terbiasa; ようにする = be function openLesson(n){

 if(!d){
  $("#main").innerHTML=`<button class="btn secondary" onclick="go('bunpou')">← Kembali ke daftar</button><div class="section"><span class="tag ${x[1].toLowerCase()}">${x[1]}</span><span class="muted">KURIKULUM · BAB ${n}</span></div><h1>Bab ${n} · ${x[2]}</h1><div class="panel"><h2>${x[3]}</h2><h3>${x[4]}</h3><p>${x[5]}</p><p>Bab ini masuk dalam peta kurikulum. Materi rinci sedang disusun bertahap; bagian ini belum boleh dianggap sebagai penjelasan lengkap.</p><button class="btn" onclick="setDone(${n});openLesson(${n})">${getDone().includes(n)?"✓ Sudah selesai":"Tandai bab selesai"}</button></div>`;
  return;
 }
 const patternHtml=d.patterns.map(p=>`<div class="word" style="display:block;margin:9px 0"><b>${p[0]}</b><p class="muted">${p[1]}</p><div class="jp">${p[2]}</div><small>${p[3]}</small><p>${p[4]}</p></div>`).join("");

 $("#main").innerHTML=`<button class="btn secondary" onclick="go('bunpou')">← Kembali ke daftar</button><div class="section"><span class="tag ${x[1].toLowerCase()}">${x[1]}</span><span class="muted">MINNA NO NIHONGO · BAB ${n}</span></div><h1>Bab ${n} · ${x[2]}</h1><p class="muted">${d.title}</p><div class="panel"><div class="eyebrow">POLA KALIMAT · 文型</div><h2>${x[4]}</h2>${patternHtml}<div class="section"><h2>Catatan penting</h2></div><ul>${d.notes.map(t=>`<li style="margin:8px 0">${t}</li>`).join("")}</ul><div class="section"><h2>Kosakata pilihan</h2><span class="muted">${d.vocab.length} kata</span></div><div class="cardgrid">${vocabHtml}</div><div class="section"><h2>Target belajar</h2></div><p>${x[5]}</p><button class="btn" onclick="setDone(${n});openLesson(${n})">${getDone().includes(n)?"✓ Bab sudah ditandai selesai":"Tandai bab selesai"}</button></div>`;

function filterWords(){let q=($("#wordSearch")?.value||"").toLowerCase(),t=$("#wordType")?.value||"";$("#wordList").innerHTML=words.filter(w=>(!t||w[4]===t)&&w.join(" ").toLowerCase().includes(q)).map(w=>`<div class="word"><div><div class="jp">${w[0]}</div><small>${w[1]} · ${w[2]}</small><b>${w[3]}</b></div><span class="tag">${w[4]}</span></div>`).join("")}
function filterKanji(){let q=($("#kanjiSearch")?.value||"").toLowerCase();$("#kanjiList").innerHTML=kanjis.filter(k=>k.join(" ").toLowerCase().includes(q)).map(k=>`<div class="kanji"><div class="char">${k[0]}</div><div><b>${k[1]}</b><small>On: ${k[2]}<br>Kun: ${k[3]}<br>${k[4]} goresan</small></div></div>`).join("")}
function updateFlash(){let w=words[flashIndex];$("#flashWord").textContent=w[0]+"　"+w[1];$("#flashAnswer").textContent=showMeaning?w[3]+" · "+w[2]:"";$("#flashCount").textContent=`Kartu ${flashIndex+1} dari ${words.length}`}
function flipCard(){showMeaning=!showMeaning;updateFlash()}function nextCard(){flashIndex=(flashIndex+1)%words.length;showMeaning=false;updateFlash()}function prevCard(){flashIndex=(flashIndex-1+words.length)%words.length;showMeaning=false;updateFlash()}
function renderQuiz(){let q=quiz[qIndex];$("#quizPanel").innerHTML=`<div class="muted">Pertanyaan ${qIndex+1} dari ${quiz.length}</div><div class="bar" style="margin:10px 0"><i style="width:${qIndex/quiz.length*100}%"></i></div><div class="question">${q[0]}</div>${q.slice(1,5).map((a,i)=>`<button class="choice ${selected===i?"selected":""}" ${answered?"disabled":""} onclick="choose(${i})">${"ABCD"[i]}. ${a}</button>`).join("")}${answered?`<div class="feedback">${selected===q[5]?"Benar! よくできました！":"Belum tepat."} ${q[6]}</div><button class="btn" onclick="nextQuestion()">${qIndex===quiz.length-1?"Lihat hasil":"Soal berikutnya →"}</button>`:`<button class="btn" onclick="checkAnswer()" ${selected<0?"disabled":""}>Periksa jawaban</button>`}`}
function choose(i){selected=i;renderQuiz()}function checkAnswer(){if(selected<0)return;answered=true;renderQuiz()}function nextQuestion(){
 quiz[qIndex]._answer=selected;
 if(qIndex===quiz.length-1){
  let score=quiz.reduce((s,q)=>s+(q[5]===q._answer?1:0),0);
  let best=Number(localStorage.getItem("jlc_quiz_best")||0);
  if(score>best)localStorage.setItem("jlc_quiz_best",String(score));
  $("#quizPanel").innerHTML=`<h2>Latihan selesai!</h2><div class="stats"><div class="stat"><strong>${score}/${quiz.length}</strong><span>Jawaban benar</span></div><div class="stat"><strong>${Math.round(score/quiz.length*100)}%</strong><span>Nilai</span></div><div class="stat"><strong>${Math.max(best,score)}/${quiz.length}</strong><span>Nilai terbaik</span></div></div><p>${score===quiz.length?"すばらしい！ Semua jawaban benar.": "Bagus, terus berlatih. Periksa kembali pola dan kosakata yang belum tepat."}</p><button class="btn" onclick="qIndex=0;selected=-1;answered=false;quiz.forEach(q=>delete q._answer);renderQuiz()">Ulangi quiz</button>`;
  return;
 }
 qIndex++;selected=-1;answered=false;renderQuiz();
} 
function exportBackup(){
 const data={app:"Japanese Learning Center",version:6,done:getDone(),writing:getWriting(),quizBest:Number(localStorage.getItem("jlc_quiz_best")||0),createdAt:new Date().toISOString()};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="japanese-learning-center-backup.json";a.click();URL.revokeObjectURL(url);
}
function importBackup(input){
 const file=input.files&&input.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.done))throw new Error("Format cadangan tidak dikenali");const done=data.done.filter(n=>Number.isInteger(n)&&n>=1&&n<=50);localStorage.setItem("jlc_done",JSON.stringify([...new Set(done)]));localStorage.setItem("jlc_writing",JSON.stringify(data.writing&&typeof data.writing==="object"?data.writing:{}));localStorage.setItem("jlc_quiz_best",String(Math.max(0,Math.min(quiz.length,Number(data.quizBest)||0))));alert("Cadangan berhasil diimpor.");render()}catch(e){alert("File cadangan tidak valid.")}};reader.readAsText(file);
}
